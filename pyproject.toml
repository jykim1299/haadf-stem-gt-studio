[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "haadf-stem-gt-studio"
version = "0.1.0"
description = "Local, auditable HAADF-STEM annotation workstation"
requires-python = ">=3.11,<3.14"
dependencies = ["PySide6-Essentials>=6.8,<7", "numpy>=2,<3", "scipy>=1.14,<2", "opencv-python-headless>=4.10,<5", "tifffile>=2024.9", "h5py>=3.12,<4", "Pillow>=11,<13"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]
atomap = ["atomap>=0.4,<1"]

[project.scripts]
haadf-studio = "haadf_studio.app:main"

[tool.setuptools.packages.find]
include = ["haadf_studio*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
